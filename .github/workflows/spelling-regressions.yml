name: Engine spelling regressions

on:
  pull_request:
    paths:
      - 'crates/engine/src/cmd/spelling.rs'
      - '.github/workflows/spelling-regressions.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spelling-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spelling:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: spelling-regressions
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run deterministic spelling tests
        run: cargo test --locked -p gridcraft-engine cmd::spelling::tests
      - name: Check spelling code quality
        run: cargo clippy --locked -p gridcraft-engine --lib --tests -- -D warnings

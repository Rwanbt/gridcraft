name: Formula deterministic regressions

on:
  pull_request:
    paths:
      - 'crates/formula/**'
      - '.github/workflows/formula-deterministic.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formula-regressions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formula-deterministic:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: formula-regressions
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Formula tests and doctests
        run: cargo test --locked -p gridcraft-formula
      - name: Formula clippy
        run: cargo clippy --locked -p gridcraft-formula --all-targets -- -D warnings
